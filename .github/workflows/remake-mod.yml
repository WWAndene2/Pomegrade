name: Remake mod

# Builds Pokemon remake mods (tools/remake, `remake_tool oras-town` and `oras-region`) from the owner's game dumps, for testing on the
# phone. Manual runs only. The dumps are never committed: GitHub's runners fetch them from the owner's Google Drive
# (files shared by link, ids in the secrets ORAS_DRIVE_ID and PLATINUM_DRIVE_ID), and an Actions cache keeps them
# between runs (evicted after 7 days unused, then fetched again). Only the mods' BPS patches leave the runner.
on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'One mod per line, "name: oras-town options" (no options = the defaults), "name: region oras-region options" or "name: append unused|piece|matrix|zone"; "... +cro <module> OFFSET=OLD:NEW" also patches a code module, "name: cro <module> OFFSET=OLD:NEW" patches one alone, "name: copy <archive> <dst>=<src>" copies archive members, "name: merge a b" joins mods built on earlier lines, "name: save Z X Y" a moved save to merge'
        # no default mod: an empty input fell back to "v24:", and an inspect-only run shipped a v24 zip the owner took for r5
        default: ''
        required: false
      inspect:
        description: 'One query per line: oras-inspect arguments ("matrix 1", "zones 0"), "world N" (Platinum matrix N as ORAS pieces), "region <oras-region options>" (its plan), "code <code_find.py options>", "verify", "list", "platinum-zones" "text <archive> <member>", "script <zone> [init]", "crodis <module.cro> [others] info|symbols|dis|xref|functions" or "spica <archive> <member> <file|-1> info|motions [--skeleton <archive>:<member>:<file|-1>]"'
        default: ''
        required: false
      headless:
        description: 'Runs of the game on the runner (tools/remake/headless), one per line, "name: oras-town options" (+cro ... allowed); empty: none'
        default: ''
        required: false
      seconds:
        description: 'Game time each headless run is given to reach the field'
        default: '120'
        required: false
      saves:
        description: 'Copies of the owner save with the player moved, one per line, "name: zone tile_x tile_z" (oras-save); each gives Save_<name>.zip'
        default: ''
        required: false

# Headless runs (job headless):
# Runs Omega Ruby with remake mods in Azahar's libretro core on the runner (software renderer, no screen), with the owner's
# save, and reports whether the field comes up; when it does not, where every thread of the game stands
# (tools/remake/headless: retro_host.cpp, pomegrade_report.inc). The phone tests without the phone, to find the code that
# bounds a map piece (tools/remake/ORAS_LITTLEROOT.md section 10, item 5). Manual runs only. The game dumps come from the
# cache the Remake mod workflow fills; the save from the owner's Drive (secret ORAS_SAVE_DRIVE_ID: a zip of the save folder
# .../title/00040000/0011c400/data/00000001). Nothing of the game or the save leaves the runner but the run's text output.
permissions:
  contents: read

jobs:
  mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Game dumps from the cache
        id: dumps
        uses: actions/cache@v4
        with:
          path: dumps
          key: remake-dumps-v1

      - name: Game dumps from Google Drive
        if: steps.dumps.outputs.cache-hit != 'true'
        env:
          ORAS_DRIVE_ID: ${{ secrets.ORAS_DRIVE_ID }}
          PLATINUM_DRIVE_ID: ${{ secrets.PLATINUM_DRIVE_ID }}
        # gdown refused the 1.9 GB file ("Cannot retrieve the public link") although it is shared by link: Drive's
        # direct download endpoint, with confirm=t to skip the too-large-to-scan page, serves it
        run: |
          mkdir -p dumps
          fetch() {
            # the secret may hold the file id or a whole share link (…/d/<id>/view, …?id=<id>): keep the id
            local id
            id=$(printf '%s' "$1" | tr -d '[:space:]' | sed -E 's#.*/d/([^/?]+).*#\1#; s#.*[?&]id=([^&]+).*#\1#')
            if ! printf '%s' "$id" | grep -qE '^[A-Za-z0-9_-]{25,}$'; then
              echo "::error::the secret for $2 is not a Drive file id (${#id} characters after cleaning)"; exit 1
            fi
            # Drive's two download endpoints, each tried in turn; their answers are logged (never the id) since a 404
            # came back for a file shared by link
            local url code
            for url in "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t" \
                       "https://drive.google.com/uc?id=$id&export=download&confirm=t"; do
              code=$(curl --location --silent --show-error --output "$2" --write-out '%{http_code}' "$url" || true)
              echo "$2: ${url%%\?*} answered $code, $(stat -c %s "$2" 2>/dev/null || echo 0) bytes"
              if [ "$code" = 200 ] && ! head -c 512 "$2" | grep -qi '<html'; then return 0; fi
              head -c 300 "$2" 2>/dev/null | tr -s '[:space:]' ' ' | sed 's/^/  answer starts: /'; echo
            done
            echo "::error::Drive did not serve $2"; exit 1
          }
          fetch "$ORAS_DRIVE_ID" dumps/oras.3ds
          fetch "$PLATINUM_DRIVE_ID" dumps/platinum.nds
          ls -l dumps

      - name: Build remake_tool
        run: |
          sudo apt-get install --yes --quiet ninja-build > /dev/null
          cmake -S tools/remake -B build-remake -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build-remake remake_tool

      - name: Build the mods
        env:
          VARIANTS: ${{ inputs.variants }}
          SAVE_DRIVE_ID: ${{ secrets.ORAS_SAVE_DRIVE_ID }}
        run: |
          set -o pipefail   # a failing command before "| tee" fails the step (a mod built without its patch must not ship)
          mkdir -p mods
          while IFS= read -r line; do
            [ -z "${line// }" ] && continue
            name="${line%%:*}"; name="${name// }"
            options="${line#*:}"
            # "... +cro <module> OFFSET=OLD:NEW ...": the module patched too (prototype/cro_patch.py; for Azahar, which skips the CRR check)
            cro=""
            if [[ "$options" == *" +cro "* ]]; then cro="${options#* +cro }"; options="${options%% +cro *}"; fi
            echo "::group::$name ($options)"
            # options are split on spaces on purpose: they are oras-town flags
            if [[ "$options" =~ ^[[:space:]]*cro[[:space:]] ]]; then
              # "name: cro <module> OFFSET=OLD:NEW ...": a code module patched alone, no map built (the title screen's species)
              cro="${options#*cro }"; mkdir -p "out/$name"
            elif [[ "$options" =~ ^[[:space:]]*save([[:space:]]|$) ]]; then
              # "name: save <zone> <tile x> <tile z>": the owner's save (Drive) with the player moved (oras-save), as the
              # sdmc folder Azahar reads under Pomegrade/3DS, with the save's 00000001.metadata beside it (to merge with a mod)
              if [ ! -d save ]; then
                id=$(printf '%s' "$SAVE_DRIVE_ID" | tr -d '[:space:]' | sed -E 's#.*/d/([^/?]+).*#\1#; s#.*[?&]id=([^&]+).*#\1#')
                curl --location --silent --show-error --output save.zip "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
                mkdir -p save && unzip -q save.zip -d save
              fi
              main=$(find save -type f -name main | head -n 1)
              meta=$(find save -type f -name '00000001.metadata' | head -n 1)
              data="out/$name/sdmc/Nintendo 3DS/00000000000000000000000000000000/00000000000000000000000000000000/title/00040000/0011c400/data"
              mkdir -p "$data" && cp -r "$(dirname "$main")" "$data/00000001"
              set -- ${options#*save}
              # "name: save" alone: the save as it is (the player where the owner left them)
              if [ $# -ge 3 ]; then ./build-remake/remake_tool oras-save "$main" "$data/00000001/main" "$1" "$2" "$3" | tee "mods/${name}_log.txt"
              else ./build-remake/remake_tool oras-save "$main" | tee "mods/${name}_log.txt"; fi
              if [ -n "$meta" ]; then cp "$meta" "$data/"; else echo "::warning::the Drive save has no 00000001.metadata"; fi
              mkdir -p "out/$name/load"
            elif [[ "$options" =~ ^[[:space:]]*merge[[:space:]] ]]; then
              # "name: merge a b ...": the load (and sdmc) folders of mods built above on earlier lines, in one mod (they must
              # change different files: a file two of them change is refused)
              mkdir -p "out/$name"
              for part in ${options#*merge }; do
                (cd "out/$part" && find . -type f) | while read -r f; do
                  if [ -e "out/$name/$f" ]; then echo "::error::$f is in two of the merged mods"; exit 1; fi
                done
                cp -r "out/$part/." "out/$name/"
              done
              (cd "out/$name" && find . -type f) | tee "mods/${name}_log.txt"
            elif [[ "$options" =~ ^[[:space:]]*copy[[:space:]] ]]; then
              # "name: copy <archive> <dst>[-<last>]=<src>[-<last>] ...": archive members copied over others (oras-copy)
              ./build-remake/remake_tool oras-copy dumps/oras.3ds "out/$name" ${options#*copy } | tee "mods/${name}_log.txt"
            elif [[ "$options" == *"append "* ]]; then
              # "name: append unused|piece|matrix|zone": the archive-member tests of oras-append-test
              ./build-remake/remake_tool oras-append-test dumps/oras.3ds "out/$name" ${options#*append } | tee "mods/${name}_log.txt"
            elif [[ "$options" == *"region "* ]]; then
              # "name: region --rect L T W H --zone H:Z ...": a new matrix of rebuilt pieces (oras-region)
              ./build-remake/remake_tool oras-region dumps/platinum.nds dumps/oras.3ds "out/$name" ${options#*region } | tee "mods/${name}_log.txt"
              cp "out/$name/region_plan.txt" "mods/${name}_plan.txt"
            else
              ./build-remake/remake_tool oras-town dumps/platinum.nds dumps/oras.3ds "out/$name" $options | tee "mods/${name}_log.txt"
              grep '^door' "out/$name/town_layout.txt" || true   # Platinum's doors and the zones they lead to
            fi
            if [ -n "$cro" ]; then
              set -- $cro
              module="$1"; shift
              ./build-remake/remake_tool oras-extract dumps/oras.3ds "$module" "out/$name.orig.cro"
              mkdir -p "out/$name.cro" && cp "out/$name.orig.cro" "out/$name.cro/$(basename "$module")"
              python3 tools/remake/prototype/cro_patch.py "out/$name.cro/$(basename "$module")" "out/$name.patched" "$@" | tee -a "mods/${name}_log.txt"
              ./build-remake/remake_tool oras-patch dumps/oras.3ds "out/$name" "$module=out/$name.patched/$(basename "$module")" | tee -a "mods/${name}_log.txt"
            fi
            (cd "out/$name" && zip -q -r "../../mods/Pomegrade_Sinnoh_$name.zip" load $( [ -d sdmc ] && echo sdmc ))
            echo "::endgroup::"
          done <<< "$VARIANTS"
          ls -l mods

      - name: Inspect the game
        if: inputs.inspect != ''
        env:
          QUERIES: ${{ inputs.inspect }}
        run: |
          set -o pipefail
          mkdir -p mods out   # out/: the extracted files, even when no mod was built before
          n=0
          while IFS= read -r query; do
            [ -z "${query// }" ] && continue
            n=$((n + 1))
            echo "::group::oras-inspect $query"
            # the query is split on spaces on purpose: it is oras-inspect's arguments
            case "$query" in
              # "world N": Platinum's matrix N laid out as ORAS pieces (oras-world)
              world\ *) ./build-remake/remake_tool oras-world dumps/platinum.nds ${query#world } "out/world_$n" | tee "mods/inspect_$n.txt" ;;
              platinum-zones) ./build-remake/remake_tool platinum-zones dumps/platinum.nds | tee "mods/inspect_$n.txt" ;;
              # "region <options>": which Platinum map header each zone block of the rectangle holds (oras-region --plan)
              region\ *) ./build-remake/remake_tool oras-region dumps/platinum.nds dumps/oras.3ds "out/region_$n" ${query#region } --plan | tee "mods/inspect_$n.txt" ;;
              # "sinnoh [strip width]": the plan for all of Sinnoh (oras-sinnoh), nothing built
              sinnoh*) ./build-remake/remake_tool oras-sinnoh dumps/platinum.nds dumps/oras.3ds ${query#sinnoh} | tee "mods/inspect_$n.txt" ;;
              verify) ./build-remake/remake_tool oras-verify dumps/oras.3ds | tee "mods/inspect_$n.txt" ;;
              # "list": every RomFS file of ORAS with its size (oras-list)
              list) ./build-remake/remake_tool oras-list dumps/oras.3ds | tee "mods/inspect_$n.txt" ;;
              # "find <text>...": where texts lie in ORAS's files and archive members (oras-find)
              find\ *) ./build-remake/remake_tool oras-find dumps/oras.3ds ${query#find } | tee "mods/inspect_$n.txt" ;;
              # "members <archive> <first> <last>": what those archive members hold, nested (oras-members)
              members\ *) ./build-remake/remake_tool oras-members dumps/oras.3ds ${query#members } | tee "mods/inspect_$n.txt" ;;
              # "hex <archive> <member> <file|-1> <offset> <length>": the bytes, 16 a line (oras-hex)
              hex\ *) ./build-remake/remake_tool oras-hex dumps/oras.3ds ${query#hex } | tee "mods/inspect_$n.txt" ;;
              # "code <code_find.py options>": the game's code searched (prototype/code_find.py, capstone)
              code\ *)
                [ -f out/code.bin ] || ./build-remake/remake_tool oras-code dumps/oras.3ds out/code.bin
                python3 -c "import capstone" 2>/dev/null || pip install --quiet capstone
                python3 tools/remake/prototype/code_find.py out/code.bin ${query#code } | tee "mods/inspect_$n.txt" ;;
              # "cro <RomFS file> <code_find.py options>": a code module of the RomFS (DllField.cro: the field) searched the same way
              cro\ *)
                set -- ${query#cro }
                ./build-remake/remake_tool oras-extract dumps/oras.3ds "$1" "out/$(basename "$1")"
                python3 -c "import capstone" 2>/dev/null || pip install --quiet capstone
                file="out/$(basename "$1")"; shift
                python3 tools/remake/prototype/code_find.py "$file" --base 0 "$@" | tee "mods/inspect_$n.txt" ;;
              # "text <archive> <member>": a game text file's lines (GameText.h); "script <zone> [init]": a zone's script
              # unpacked and disassembled (Amx.h)
              text\ *) ./build-remake/remake_tool oras-text dumps/oras.3ds ${query#text } | tee "mods/inspect_$n.txt" ;;
              script\ *) ./build-remake/remake_tool oras-script dumps/oras.3ds ${query#script } | tee "mods/inspect_$n.txt" ;;
              # "crodis <module.cro> [other .cro/.crs ...] info|symbols|dis <address|symbol> [n]|xref <...>|functions": a code
              # module read as the loader reads it (prototype/cro_dis.py: exports, imports, relocations, named calls)
              crodis\ *)
                set -- ${query#crodis }
                files=()
                while [ $# -gt 0 ] && case "$1" in *.cro|*.crs) true ;; *) false ;; esac; do
                  ./build-remake/remake_tool oras-extract dumps/oras.3ds "$1" "out/$(basename "$1")"
                  files+=("out/$(basename "$1")"); shift
                done
                python3 -c "import capstone" 2>/dev/null || pip install --quiet capstone
                python3 tools/remake/prototype/cro_dis.py "${files[@]}" "$@" | tee "mods/inspect_$n.txt" ;;
              # "spica <archive> <member> <file|-1> info|motions [--skeleton <archive>:<member>:<file|-1>]": what SPICA reads of
              # a member (tools/remake/spica); only its text report leaves the runner
              spica\ *)
                set -- ${query#spica }
                if [ ! -x out/spica/spica ]; then
                  git submodule update --init --depth 1 tools/remake/external/SPICA
                  dotnet build -c Release -o out/spica tools/remake/spica/SpicaCli.csproj > /dev/null
                fi
                ./build-remake/remake_tool oras-member dumps/oras.3ds "$1" "$2" "$3" out/spica_in.bin
                cmd=$4; shift 4
                extra=()
                if [ "${1:-}" = --skeleton ]; then
                  IFS=: read -r sa sm sf <<< "$2"
                  ./build-remake/remake_tool oras-member dumps/oras.3ds "$sa" "$sm" "$sf" out/spica_skeleton.bin
                  extra=(--skeleton out/spica_skeleton.bin)
                fi
                out/spica/spica "$cmd" out/spica_in.bin "${extra[@]}" | tee "mods/inspect_$n.txt" ;;
              *) ./build-remake/remake_tool oras-inspect dumps/oras.3ds $query | tee "mods/inspect_$n.txt" ;;
            esac
            echo "::endgroup::"
          done <<< "$QUERIES"

      - name: Moved saves
        if: inputs.saves != ''
        env:
          SAVE_DRIVE_ID: ${{ secrets.ORAS_SAVE_DRIVE_ID }}
          SAVES: ${{ inputs.saves }}
        run: |
          set -o pipefail
          mkdir -p mods
          id=$(printf '%s' "$SAVE_DRIVE_ID" | tr -d '[:space:]' | sed -E 's#.*/d/([^/?]+).*#\1#; s#.*[?&]id=([^&]+).*#\1#')
          if [ -z "$id" ]; then echo "::error::no secret ORAS_SAVE_DRIVE_ID"; exit 1; fi
          curl --location --silent --show-error --output save.zip "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
          mkdir -p save && unzip -q save.zip -d save
          main=$(find save -type f -name main | head -n 1)
          if [ -z "$main" ]; then echo "::error::the save zip has no file named main"; exit 1; fi
          meta=$(find save -type f -name '00000001.metadata' | head -n 1)
          while IFS= read -r line; do
            [ -z "${line// }" ] && continue
            name="${line%%:*}"; name="${name// }"
            set -- ${line#*:}
            # the zip as the phone holds it: the folder 00000001 (the moved main, the rest copied) and its .metadata beside it
            rm -rf "out/save_$name" && mkdir -p "out/save_$name" && cp -r "$(dirname "$main")" "out/save_$name/00000001"
            ./build-remake/remake_tool oras-save "$main" "out/save_$name/00000001/main" "$1" "$2" "$3" | tee "mods/Save_${name}_log.txt"
            if [ -n "$meta" ]; then cp "$meta" "out/save_$name/"; fi
            (cd "out/save_$name" && zip -q -r "../../mods/Save_$name.zip" .)
          done <<< "$SAVES"

      - uses: actions/upload-artifact@v4
        with:
          name: remake-mods
          path: mods
          retention-days: 14

  headless:
    # Omega Ruby run on the runner in Azahar's libretro core (tools/remake/headless): see the comment at the top
    if: inputs.headless != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azahar's submodules
        run: git submodule update --init --recursive --depth 1 azahar

      - name: Game dumps from the cache
        id: dumps
        uses: actions/cache/restore@v4
        with:
          path: dumps
          key: remake-dumps-v1

      - name: Stop without the dumps
        if: steps.dumps.outputs.cache-hit != 'true'
        run: |
          echo "::error::no game dumps in the cache: run the Remake mod workflow once first (it fetches them from Drive)"
          exit 1

      - name: The owner's save from Google Drive
        env:
          SAVE_DRIVE_ID: ${{ secrets.ORAS_SAVE_DRIVE_ID }}
        run: |
          id=$(printf '%s' "$SAVE_DRIVE_ID" | tr -d '[:space:]' | sed -E 's#.*/d/([^/?]+).*#\1#; s#.*[?&]id=([^&]+).*#\1#')
          # without a save the game starts a new game and cannot reach the field: such a run only checks the core and the host
          if [ -z "$id" ]; then echo "::warning::no secret ORAS_SAVE_DRIVE_ID: runs without a save (new game, no field)"; exit 0; fi
          curl --location --silent --show-error --output save.zip "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
          if ! unzip -tq save.zip > /dev/null; then echo "::error::Drive did not serve a zip for the save"; exit 1; fi
          mkdir -p save && unzip -q save.zip -d save
          # the zip may hold the folder 00000001 or its content: the folder holding "main" is the save
          main=$(find save -type f -name main | head -n 1)
          if [ -z "$main" ]; then echo "::error::the save zip has no file named main"; exit 1; fi
          echo "SAVE_DIR=$(dirname "$main")" >> "$GITHUB_ENV"
          # Azahar keeps a save's format info beside its folder (data/00000001.metadata, archive_source_sd_savedata.cpp); without
          # it GetFormatInfo fails and the game treats the save as absent: run 70 deleted it and started a new game
          # (DllSangoIntro, then name entry). The phone's own file is used when the zip holds one
          meta=$(find save -type f -name '00000001.metadata' | head -n 1)
          if [ -n "$meta" ]; then echo "SAVE_METADATA=$meta" >> "$GITHUB_ENV"; else echo "::warning::the save zip has no 00000001.metadata: a guessed one is written (see the run step)"; fi
          ls -l "$(dirname "$main")"

      - name: Install the build tools
        run: sudo apt-get install --yes --quiet ninja-build ccache > /dev/null

      - name: Compilation cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: remake-headless-ccache-${{ github.sha }}
          restore-keys: remake-headless-ccache-

      - name: Build Azahar's libretro core (software renderer) with the thread report
        run: |
          # the report is added to the runner's copy only, never to the repository's Azahar sources
          cat tools/remake/headless/pomegrade_report.inc >> azahar/src/citra_libretro/citra_libretro.cpp
          python3 - <<'PY'
          # the file-open trace (fs_open_trace.inc) in place of OpenFile's debug line; fails loudly if Azahar's line moved
          p = "azahar/src/core/hle/service/fs/fs_user.cpp"
          s = open(p).read()
          line = '    LOG_DEBUG(Service_FS, "path={}, mode={} attrs={}", file_path.DebugStr(), mode.hex, attributes);\n'
          assert s.count(line) == 1, "OpenFile's debug line not found"
          s = s.replace(line, open("tools/remake/headless/fs_open_trace.inc").read())
          s = s.replace('#include "core/hle/kernel/process.h"', '#include "core/hle/kernel/process.h"\n#include "core/hle/kernel/thread.h"\n#include "core/memory.h"', 1)
          open(p, "w").write(s)
          # the software renderer crashes reading a texel (every headless run with the save, at the title screen's exit: SIGSEGV in
          # LookupTexelInTile from TextureColor)
          p = "azahar/src/video_core/renderer_software/sw_rasterizer.cpp"
          s = open(p).read()
          line = "            texture_color[i] = LookupTexture(texture_data, s, t, info);\n"
          assert s.count(line) == 1, "the software renderer's texture lookup not found"
          # runs 56, 60 and 63 crashed there even with the pointer, the texture's last byte and the coordinates checked: no texel is read
          # at all (black). The headless runs need the field's modules and the threads, not the picture
          s = s.replace(line, "            (void)texture_data; (void)info;\n            texture_color[i] = Common::Vec4<u8>{0, 0, 0, 255};\n")
          open(p, "w").write(s)
          PY
          export CCACHE_DIR=~/.cache/ccache CCACHE_MAXSIZE=2G
          cmake -S azahar -B build-azahar -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_LIBRETRO=ON \
            -DENABLE_OPENGL=OFF -DENABLE_VULKAN=OFF -DENABLE_TESTS=OFF -DENABLE_CCACHE=ON > /dev/null
          ninja -C build-azahar citra_libretro
          ccache --show-stats | head -5
          core=$(find build-azahar -name '*libretro*.so' | head -n 1)
          echo "CORE=$core" >> "$GITHUB_ENV"
          ls -l "$core"

      - name: Build remake_tool and retro_host
        run: |
          cmake -S tools/remake -B build-remake -G Ninja -DCMAKE_BUILD_TYPE=Release > /dev/null
          ninja -C build-remake remake_tool
          sudo apt-get install -y -qq gdb > /dev/null
          g++ -std=c++17 -O2 -g -I azahar/externals/libretro-common/libretro-common/include tools/remake/headless/retro_host.cpp -ldl -o retro_host

      - name: Run the game with each mod
        env:
          RUNS: ${{ inputs.headless }}
          SECONDS_GIVEN: ${{ inputs.seconds }}
        run: |
          set -o pipefail
          mkdir -p results
          while IFS= read -r line; do
            [ -z "${line// }" ] && continue
            name="${line%%:*}"; name="${name// }"
            options="${line#*:}"
            cro=""
            if [[ "$options" == *" +cro "* ]]; then cro="${options#* +cro }"; options="${options%% +cro *}"; fi
            echo "::group::$name ($options${cro:+ +cro $cro})"
            # the mod, as the Remake mod workflow builds it
            ./build-remake/remake_tool oras-town dumps/platinum.nds dumps/oras.3ds "out/$name" $options > "results/${name}_build.txt"
            mod="out/$name/load/mods/000400000011C400"
            if [ -n "$cro" ]; then
              set -- $cro
              module="$1"; shift
              ./build-remake/remake_tool oras-extract dumps/oras.3ds "$module" "out/$name.cro"
              python3 tools/remake/prototype/cro_patch.py "out/$name.cro" "out/$name.patched" "$@"
              ./build-remake/remake_tool oras-patch dumps/oras.3ds "out/$name" "$module=out/$name.patched/$(basename "out/$name.cro")" > /dev/null
            fi
            # a fresh user folder per run: the mod and the save
            work="work/$name"
            user="$work/Azahar"
            mkdir -p "$user/load/mods"
            cp -r "$mod" "$user/load/mods/"
            savedir="$user/sdmc/Nintendo 3DS/00000000000000000000000000000000/00000000000000000000000000000000/title/00040000/0011c400/data/00000001"
            if [ -n "$SAVE_DIR" ]; then
              mkdir -p "$savedir" && cp -r "$SAVE_DIR"/. "$savedir/"
              if [ -n "$SAVE_METADATA" ]; then cp "$SAVE_METADATA" "$savedir.metadata"
              # ArchiveFormatInfo, 16 bytes: total size, directories, files (u32 each), duplicate data (u8), padding. GUESSED
              # (not the game's own values): the size of the files in the save, 0 directories, their count, no duplication
              else python3 -c "import struct,sys,os; d=sys.argv[1]; f=[os.path.join(r,n) for r,_,ns in os.walk(d) for n in ns]; open(d+'.metadata','wb').write(struct.pack('<IIIB3x', sum(map(os.path.getsize,f)), 0, len(f), 0))" "$savedir"; fi
            fi
            # under gdb: a crash of the core prints its backtrace instead of a bare "Segmentation fault"
            gdb -q -batch -ex 'handle SIGSEGV stop' -ex run -ex 'bt 30' -ex 'info sharedlibrary' --args \
              ./retro_host "$CORE" dumps/oras.3ds "$work" "$SECONDS_GIVEN" 2>&1 | grep -v '^\[New Thread\|^\[Thread' | tee "results/$name.txt" || true
            grep '^RESULT' "results/$name.txt" || echo "RESULT: the host stopped without a result"
            echo "::endgroup::"
          done <<< "$RUNS"
          echo "== results"
          grep -H '^RESULT' results/*.txt || true
