name: Android APK

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: melonDS-android

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            -Dorg.gradle.jvmargs=-Xmx6g -Pkotlin.daemon.jvmargs=-Xmx4g \
            :app:assemblePlayStoreProdDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pomegrade-debug-apk
          path: melonDS-android/app/build/**/playStoreProd/debug/*.apk
          if-no-files-found: error
