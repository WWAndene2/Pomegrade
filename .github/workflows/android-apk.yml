name: Android APK

# Builds take ~45 min: only main, plus manual runs from the Actions tab
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# a new push on a branch cancels the build of the previous one
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: melonDS-android

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu
          cache: gradle

      # The runner image ships the Android SDK; only add what the build pins
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108" "ndk;27.3.13750724" "cmake;3.22.1" "cmake;3.31.6" "platforms;android-36"

      # Compilation cache: only the first build compiles all the C++ (~30 min),
      # later ones only recompile what changed
      - name: Install ccache
        run: sudo apt-get install -y -q ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Build debug APK
        env:
          POMEGRADE_CCACHE: '1'
          CCACHE_DIR: /home/runner/.cache/ccache
          # paths differ between runs, hash compilers by content
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 3G
          CCACHE_NOHASHDIR: 'true'
        run: |
          ccache --zero-stats
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            -Dorg.gradle.jvmargs=-Xmx6g -Pkotlin.daemon.jvmargs=-Xmx4g \
            -Pandroid.injected.build.abi=arm64-v8a \
            :app:assemblePlayStoreProdDebug
          ccache --show-stats

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pomegrade-debug-apk
          path: melonDS-android/app/build/**/playStoreProd/debug/*.apk
          if-no-files-found: error
