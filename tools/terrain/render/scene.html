<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three'; import { loadModel } from './trmodel.js';
const N=window.N, SIZE=1000, HEIGHT=170*2.0/1.4, WATER=0.02;
const dec=s=>new Float32Array(Uint8Array.from(atob(s),c=>c.charCodeAt(0)).buffer);
const H=dec(window.H), R=dec(window.R), F=dec(window.F), M=dec(window.M); const S=dec(window.S), SN=dec(window.SN);
const ss=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x);};
const view=new URLSearchParams(location.search).get('v')||'0';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(1600,900); renderer.setPixelRatio(1);
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xcfeaff,900,2600);
// sky gradient
const sky=new THREE.Mesh(new THREE.SphereGeometry(3000,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
 uniforms:{},vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec3 p;void main(){float t=clamp(normalize(p).y*1.6,0.,1.);gl_FragColor=vec4(mix(vec3(.86,.95,1.),vec3(.42,.72,1.),t),1.);}'}));
scene.add(sky);
const at=(x,y)=>H[Math.min(N-1,Math.max(0,y))*N+Math.min(N-1,Math.max(0,x))];
const FW=window.FINE, FH=dec(window.FH).map(v=>v*2.0/1.4), FF=dec(window.FFADE), FN=FW.F, FSH=dec(window.FSH), FAO=dec(window.FAO);
const SHD=dec(window.SH), AOD=dec(window.AO);
const fineIdx=(x,z)=>{const u=(x-FW.cx)/FW.size+0.5, v=(z-FW.cz)/FW.size+0.5; return (u<0||v<0||u>1||v>1)?null:[u*(FN-1),v*(FN-1)];};
const bil=(A,n,fx,fz)=>{const ix=Math.min(n-2,Math.floor(fx)), iz=Math.min(n-2,Math.floor(fz)), u=fx-ix, v=fz-iz;
  return (A[iz*n+ix]*(1-u)+A[iz*n+ix+1]*u)*(1-v)+(A[(iz+1)*n+ix]*(1-u)+A[(iz+1)*n+ix+1]*u)*v;};
const heightAt=(x,z)=>{const f=fineIdx(x,z); if(f) return bil(FH,FN,f[0],f[1]);
  return bil(H,N,(x/SIZE+0.5)*(N-1),(z/SIZE+0.5)*(N-1))*HEIGHT;};
const fadeAt=(x,z)=>{const f=fineIdx(x,z); return f?bil(FF,FN,f[0],f[1]):0;};
const geo=new THREE.PlaneGeometry(SIZE,SIZE,N-1,N-1); geo.rotateX(-Math.PI/2);
const pos=geo.attributes.position, col=new Float32Array(pos.count*3);
const C=(h)=>new THREE.Color(h);
const grassLo=C(0x9bd65f), grassHi=C(0x6fbf4a), forest=C(0x4e9a3e), rock=C(0xb9aa98), rockDark=C(0x8f8476),
      snow=C(0xf5f9ff), sand=C(0xead9a0), riverC=C(0x5cc4ee);
const trees=[];
const WA=new Float32Array(pos.count*4), WB=new Float32Array(pos.count*4);
for(let i=0;i<pos.count;i++){
  const x=i%N, y=(i/N)|0, h=H[i];
  pos.setY(i,h*HEIGHT-fadeAt(pos.getX(i),pos.getZ(i))*1.5);
  const sx=(at(x+1,y)-at(x-1,y))*HEIGHT/(2*SIZE/N), sy=(at(x,y+1)-at(x,y-1))*HEIGHT/(2*SIZE/N);
  const slope=S[i]; // material slope, from the relief smoothed over ~4 cells: grass covers the small ravines
  const woods=ss(0.5,0.6,F[i]);
  let rock=ss(1.1,1.4,slope), rockb=ss(1.5,2.0,slope)*0.25;
  const snowLine=0.7+0.16*(M[i]-0.5)+(sy>0?0.05:-0.04)+0.08*ss(0.4,0.9,slope);
  let snow=SN[i];
  let sand=1-ss(WATER+0.006,WATER+0.016,h);
  let river=ss(0.35,0.45,R[i])*ss(WATER,WATER+0.01,h);
  let forest=woods*(1-ss(0.4,0.48,h));
  let meadow=ss(0.25,0.55,h)*(1-forest)+ (M[i]-0.5)*0.6;
  meadow=Math.min(1,Math.max(0,meadow));
  // normalise in priority: snow > sand > rock > forest/meadow/grass
  const rem=(v,used)=>v*(1-used);
  let used=0; const sn=snow; used=sn;
  const sa=rem(sand,used); used+=sa;
  const ro=rem(Math.min(1,rock),used); used+=ro;
  const rb=ro*rockb; 
  const fo=rem(forest,used); used+=fo;
  const me=rem(meadow,used); used+=me;
  const gr=Math.max(0,1-used);
  WA.set([gr,me,fo,ro-rb],i*4); WB.set([rb,sn,sa,river],i*4);
  const rnd=Math.abs(Math.sin(i*12.9898)*43758.5453)%1;
  if(false) trees.push([pos.getX(i)+(rnd-.5)*3,h*HEIGHT,pos.getZ(i)+(rnd*7%1-.5)*3,h,rnd]);
}
{const lt=new Float32Array(pos.count*2); for(let i=0;i<pos.count;i++){lt[i*2]=SHD[i];lt[i*2+1]=AOD[i];} geo.setAttribute('lt',new THREE.BufferAttribute(lt,2));}
geo.setAttribute('wa',new THREE.BufferAttribute(WA,4)); geo.setAttribute('wb',new THREE.BufferAttribute(WB,4)); geo.computeVertexNormals();
// soft 3-step toon ramp, as in the Switch games' terrain
const ramp=new THREE.DataTexture(new Uint8Array([120,120,120,255, 190,190,190,255, 255,255,255,255]),3,1);
ramp.minFilter=ramp.magFilter=THREE.NearestFilter; ramp.needsUpdate=true;
const L=new THREE.TextureLoader(); const tex=n=>{const t=L.load('tex/'+n+'.png');t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=n.endsWith('_n')?THREE.NoColorSpace:THREE.SRGBColorSpace;t.anisotropy=8;return t;};
const U={}; for(const n of ['grass','meadow','forest','rock','rockb','snow','sand','dirt']){U['t_'+n]={value:tex(n)};U['n_'+n]={value:tex(n+'_n')};}
U.sunDir={value:new THREE.Vector3(-0.62,0.42,0.6).normalize()}; U.fogC={value:new THREE.Color(0xcfeaff)}; U.fogR={value:new THREE.Vector2(900,2600)};
const terrainMat=new THREE.ShaderMaterial({uniforms:U,vertexShader:`
attribute vec4 wa; attribute vec4 wb; attribute vec2 lt; varying vec2 vl; varying vec4 va; varying vec4 vb; varying vec3 wp; varying vec3 wn; varying float vd;
void main(){vl=lt;va=wa;vb=wb;vec4 w=modelMatrix*vec4(position,1.);wp=w.xyz;wn=normalize(normal);vec4 mv=viewMatrix*w;vd=-mv.z;gl_Position=projectionMatrix*mv;}`,
fragmentShader:`
${['grass','meadow','forest','rock','rockb','snow','sand','dirt'].map(n=>'uniform sampler2D t_'+n+';uniform sampler2D n_'+n+';').join('')}
uniform vec3 sunDir; uniform vec3 fogC; uniform vec2 fogR;
varying vec2 vl; varying vec4 va; varying vec4 vb; varying vec3 wp; varying vec3 wn; varying float vd;
vec3 srgb(vec3 c){return c;}
// planar sample with a second, rotated scale to hide tiling
vec4 plan(sampler2D t, float s){vec2 uv=wp.xz/s; vec2 uv2=mat2(.8,-.6,.6,.8)*wp.xz/(s*3.1);return mix(texture2D(t,uv),texture2D(t,uv2),.35);}
vec4 tri(sampler2D t, float s, vec3 n){vec3 b=pow(abs(n),vec3(4.));b/=b.x+b.y+b.z;
  return texture2D(t,wp.zy/s)*b.x+texture2D(t,wp.xz/s)*b.y+texture2D(t,wp.xy/s)*b.z;}
vec3 nrm(sampler2D t, float s){vec3 n=plan(t,s).xyz*2.-1.;return n;}
void main(){
  vec3 N=normalize(wn);
  vec3 c=plan(t_grass,9.).rgb*va.x+plan(t_meadow,11.).rgb*va.y+plan(t_forest,8.).rgb*va.z
        +tri(t_rock,22.,N).rgb*va.w+tri(t_rockb,26.,N).rgb*vb.x+(plan(t_snow,30.).rgb*.55+vec3(.5))*vb.y+plan(t_sand,10.).rgb*vb.z;
  c=mix(c,vec3(.32,.66,.86),vb.w*.85);
  // detail normals from the same materials
  vec3 tn=nrm(n_grass,9.)*(va.x+va.y+va.z)+nrm(n_rock,22.)*(va.w+vb.x)+nrm(n_snow,12.)*vb.y*1.6+nrm(n_sand,10.)*vb.z;
  vec3 T=normalize(cross(vec3(0.,0.,1.),N)), B=cross(N,T);
  vec3 Nd=normalize(N+(T*tn.x+B*tn.y)*.9);
  float diff=max(dot(Nd,sunDir),0.)*.75+.25*(dot(Nd,sunDir)*.5+.5);
  vec3 sky=mix(vec3(.42,.47,.36),vec3(.78,.86,.96),Nd.y*.5+.5);
  float shd=vl.x, ao=vl.y*vl.y;
  vec3 col=c*(vec3(1.1,1.02,.9)*diff*1.45*shd+sky*.6*ao);
  float sn=vb.y; float lit=max(dot(Nd,sunDir),0.);
  col=mix(col, c*(vec3(1.08,1.04,1.0)*lit*1.6*shd+vec3(.5,.62,.86)*.7*ao), sn);   // snow: bright in sun, blue in shade
  col=pow(col,vec3(1./2.2));
  float f=smoothstep(fogR.x,fogR.y,vd); col=mix(col,fogC,f);
  gl_FragColor=vec4(col,1.);
}`});
const terrain=new THREE.Mesh(geo,terrainMat);
// --- the 2 m window: its own mesh, the same materials, weights from its own slopes
{ const fg=new THREE.PlaneGeometry(FW.size,FW.size,FN-1,FN-1); fg.rotateX(-Math.PI/2); fg.translate(FW.cx,0,FW.cz);
  const fp=fg.attributes.position, wa=new Float32Array(fp.count*4), wb=new Float32Array(fp.count*4), cell=FW.size/(FN-1);
  const fat=(x,y)=>FH[Math.min(FN-1,Math.max(0,y))*FN+Math.min(FN-1,Math.max(0,x))];
  for(let i=0;i<fp.count;i++){
    const x=i%FN, y=(i/FN)|0; fp.setY(i,FH[i]);
    const r=2; const sx=(fat(x+r,y)-fat(x-r,y))/(2*r*cell), sy=(fat(x,y+r)-fat(x,y-r))/(2*r*cell);
    const slope=Math.hypot(sx,sy);
    const wx=fp.getX(i), wz=fp.getZ(i), gi=Math.round((wz/SIZE+0.5)*(N-1))*N+Math.round((wx/SIZE+0.5)*(N-1));
    const h=FH[i]/HEIGHT, woods=ss(0.5,0.6,F[gi]);
    const snow=SN[gi]*(1-ss(1.0,1.3,slope));
    const rock=ss(1.1,1.4,slope)*(1-snow);
    const forest=woods*(1-ss(0.4,0.48,h))*(1-rock)*(1-snow);
    const meadow=Math.min(1,Math.max(0,(ss(0.25,0.55,h)+(M[gi]-0.5)*0.6)))*(1-forest)*(1-rock)*(1-snow);
    const grass=Math.max(0,1-snow-rock-forest-meadow);
    wa.set([grass,meadow,forest,rock],i*4); wb.set([0,snow,0,0],i*4);
  }
  {const lt=new Float32Array(fp.count*2); for(let i=0;i<fp.count;i++){lt[i*2]=FSH[i];lt[i*2+1]=FAO[i];} fg.setAttribute('lt',new THREE.BufferAttribute(lt,2));}
  fg.setAttribute('wa',new THREE.BufferAttribute(wa,4)); fg.setAttribute('wb',new THREE.BufferAttribute(wb,4)); fg.computeVertexNormals();
  scene.add(new THREE.Mesh(fg,terrainMat)); }
scene.add(terrain);
// lake / sea
const water=new THREE.Mesh(new THREE.PlaneGeometry(SIZE*12,SIZE*12),new THREE.MeshToonMaterial({color:0x4fb4ee,transparent:true,opacity:0.88,gradientMap:ramp}));
water.rotation.x=-Math.PI/2; water.position.y=WATER*HEIGHT; scene.add(water);
// light
scene.add(new THREE.HemisphereLight(0xdff2ff,0x6a8a50,1.1));
const sun=new THREE.DirectionalLight(0xfff4dd,2.2); sun.position.set(-620,420,600); scene.add(sun);
const cams={
 '0':[[-700,420,700],[0,60,0],45],   // overview
 '1':[[-120,70,330],[150,90,-80],55],    // from a valley floor
 '2':[[420,230,380],[0,100,-100],45],
 '3':[[window.GV[0],0,window.GV[1]],[window.GV[2],0,window.GV[3]],42],   // toward the peaks
};
const [p,t,f]=cams[view];
const hAt=(x,z)=>{const gx=Math.round((x/SIZE+0.5)*(N-1)), gz=Math.round((z/SIZE+0.5)*(N-1));return at(gx,gz)*HEIGHT;};
if(view==='3'){p[1]=heightAt(p[0],p[2])+0.08; t[1]=hAt(t[0],t[2])*0.92;}
const cam=new THREE.PerspectiveCamera(f,16/9,view==='3'?0.01:1,8000); cam.position.set(...p); cam.lookAt(...t);
// keep the camera above ground
const gx=Math.round((cam.position.x/SIZE+0.5)*(N-1)), gz=Math.round((cam.position.z/SIZE+0.5)*(N-1));
if(view!=='3'&&gx>=0&&gx<N&&gz>=0&&gz<N) cam.position.y=Math.max(cam.position.y,at(gx,gz)*HEIGHT+25);
// --- Scarlet's firs and grass, placed by rules near the camera (beyond, the forest floor texture stands for them)
const M_PER_UNIT=SIZE*1.0/1000*30.7; const UM=1/M_PER_UNIT;  // the map is ~30.7 km wide
const sample=(x,z,A)=>{const gx=Math.round((x/SIZE+0.5)*(N-1)), gz=Math.round((z/SIZE+0.5)*(N-1));
  return (gx<0||gz<0||gx>=N||gz>=N)?-1:A[gz*N+gx];};
let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const center=view==='3'?[p[0],p[2]]:[t[0],t[2]];
const firNames=['plants_me_tree_fir03','plants_me_tree_fir04','plants_me_tree_fir02'];
const near=await Promise.all(firNames.map(n=>loadModel(n))), far=await Promise.all(firNames.map(n=>loadModel(n+'_lod2')));
const snowFir=await loadModel('plants_me_tree_fir03_snow');
const nearL=firNames.map(()=>[]), farL=firNames.map(()=>[]), snowL=[];
const NEAR_R=15, FAR_R=view==='3'?60:260, MAXN=7000, MAXF=22000;
let nn=0, nf=0;
for(let k=0;k<2500000 && (nn<MAXN||nf<MAXF);k++){
  const a=rnd()*Math.PI*2, r=Math.sqrt(rnd())*FAR_R, x=center[0]+Math.cos(a)*r, z=center[1]+Math.sin(a)*r;
  if(view==='3'){ const dx=x-p[0], dz=z-p[2], tx=t[0]-p[0], tz=t[2]-p[2]; if(dx*tx+dz*tz<0 && r>3) continue; }  // only what the camera sees
  const hh=heightAt(x,z); const gi=Math.round((z/SIZE+0.5)*(N-1))*N+Math.round((x/SIZE+0.5)*(N-1)); if(gi<0||gi>=N*N) continue;
  const h=hh/HEIGHT, f=F[gi], sl=S[gi], sn=SN[gi];
  const dens=ss(0.46,0.56,f)*(1-ss(0.54,0.6,h))*(1-ss(0.9,1.2,sl));
  if(rnd()>dens) continue;
  const item=[x,hh,z,rnd()*6.28,(0.75+rnd()*0.6)*UM], kind=Math.floor(rnd()*3);
  if(sn>0.3){ if(r<NEAR_R) snowL.push(item); continue; }
  if(r<NEAR_R){ if(nn<MAXN){nearL[kind].push(item);nn++;} } else if(nf<MAXF){farL[kind].push(item);nf++;}
}
const place=(m,list)=>{if(!list.length) return; const im=new THREE.InstancedMesh(m.geometry,m.materials,list.length),o=new THREE.Object3D();
  list.forEach((t,k)=>{o.position.set(t[0],t[1]-0.01,t[2]);o.rotation.set(0,t[3],0);o.scale.setScalar(t[4]);o.updateMatrix();im.setMatrixAt(k,o.matrix);});scene.add(im);};
near.forEach((m,k)=>place(m,nearL[k])); far.forEach((m,k)=>place(m,farL[k])); place(snowFir,snowL);
if(view==='3'){
  const grassM=[await loadModel('plants_me_main_grass01'),await loadModel('plants_me_main_grass11'),await loadModel('plants_me_level_grass01')];
  grassM.forEach((gm,k)=>{const n=55000; gm.materials[0].color=new THREE.Color(1.35,1.4,1.05); const im=new THREE.InstancedMesh(gm.geometry,gm.materials[0],n),o=new THREE.Object3D();let c=0;
    for(let j=0;j<n*6&&c<n;j++){
      const r=-Math.log(1-rnd()*0.9995)*1.6;              // exponential falloff: dense at the feet, sparse ~300 m out
      if(r>10) continue;
      const a=rnd()*6.283, x=p[0]+Math.cos(a)*r, z=p[2]+Math.sin(a)*r;
      const dx=x-p[0], dz=z-p[2], tx=t[0]-p[0], tz=t[2]-p[2]; if(dx*tx+dz*tz<0 && r>0.2) continue;
      const gi=Math.round((z/SIZE+0.5)*(N-1))*N+Math.round((x/SIZE+0.5)*(N-1));
      if(SN[gi]>0.2) continue;
      const f=fineIdx(x,z); if(f){ const i2=Math.round(f[1])*FN+Math.round(f[0]); }
      o.position.set(x,heightAt(x,z),z);o.rotation.set(0,rnd()*6.28,0);
      o.scale.setScalar((1.3+rnd()*0.9)*UM*(1+r*0.35));   // further tufts larger: they stand for several
      o.updateMatrix();im.setMatrixAt(c++,o.matrix);}
    im.count=c; scene.add(im);});
}
document.title='placed '+(nn+nf)+' firs';
THREE.DefaultLoadingManager.onLoad=()=>{};
setTimeout(()=>{renderer.render(scene,cam);document.title='done';},15000);
