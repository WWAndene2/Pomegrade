<!doctype html>
<!--
  Pomegrade remake: the world editor (remake step 6). Opens world_oras.json, as
  remake_tool oras-world writes it (a Platinum map matrix at Omega Ruby's scale,
  in 40x40-tile pieces), edits its tiles, buildings, warps and the DS -> ORAS
  model associations, and saves it back in the same format. The 3D tab shows
  world_oras.gltf. One self-contained page, no library: open it in a browser
  (PC or phone), nothing to install.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remake World Editor</title>
<style>
  /* Pomegrade palette (melonDS-android/app ui/theme/Colors.kt); sizes on the project's scale (CLAUDE.md section 7) */
  :root {
    --primary: #A20F27; --primary-dark: #7A0B1D; --accent: #C62839;
    --bg: #FBF7F5; --surface: #FFFFFF; --nav: #F3ECE9; --divider: #E6DCD8;
    --text: #222222; --text-2: #767676; --on-primary: #FFFFFF;
    --map-bg: #E6DCD8; --sel: #F0566B;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #2A1A1D; --primary-dark: #1C1113; --accent: #F0566B;
      --bg: #1E1517; --surface: #2A1A1D; --nav: #241719; --divider: #3A2A2D;
      --text: #FFFFFF; --text-2: #C1C1C1; --on-primary: #FFFFFF;
      --map-bg: #120C0D; --sel: #F0566B;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; flex-direction: column; overflow: hidden; }
  header { background: var(--primary); color: var(--on-primary); display: flex; align-items: center; gap: 8px;
           padding: 8px 16px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 16px 0 0; font-weight: 600; white-space: nowrap; }
  header .spacer { flex: 1; }
  button, .button { font: inherit; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid transparent;
                    background: var(--surface); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
                    white-space: nowrap; }
  header button, header .button { background: rgba(255,255,255,0.12); color: var(--on-primary); }
  header button:hover, header .button:hover { background: rgba(255,255,255,0.24); }
  button:disabled { opacity: 0.48; cursor: default; }
  button.on { background: var(--accent); color: #fff; }
  header button.on { background: #fff; color: var(--primary-dark); }
  input[type=file] { display: none; }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--nav);
             border-bottom: 1px solid var(--divider); flex-wrap: wrap; }
  .toolbar .group { display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; }
  .toolbar #tools { gap: 4px; }
  .toolbar .sep { width: 1px; height: 24px; background: var(--divider); margin: 0 4px; }
  .toolbar label { display: inline-flex; align-items: center; gap: 4px; color: var(--text-2); }
  input[type=text], input[type=number] { font: inherit; height: 32px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--divider);
                                          background: var(--surface); color: var(--text); width: 96px; }
  input.narrow { width: 64px; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; background: var(--map-bg); }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #stage #gl { display: none; }  /* over "#stage canvas": hidden until the 3D tab, or it takes the map's clicks */
  #stage.three #map { display: none; }
  #stage.three #gl { display: block; }
  #stage.three #empty { display: none; } /* the 3D tab has its own prompt (#gl-msg) */
  aside { width: 320px; border-left: 1px solid var(--divider); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
  aside nav { display: flex; border-bottom: 1px solid var(--divider); }
  aside nav button { flex: 1; border-radius: 0; height: 48px; background: transparent; border-bottom: 2px solid transparent; }
  aside nav button.on { background: transparent; color: var(--accent); border-bottom-color: var(--accent); }
  aside section { padding: 16px; overflow: auto; flex: 1; }
  aside h2 { font-size: 14px; margin: 0 0 8px; color: var(--text-2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 4px 8px; margin-bottom: 16px; align-items: center; }
  .kv span:nth-child(odd) { color: var(--text-2); }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .muted { color: var(--text-2); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 4px; border-bottom: 1px solid var(--divider); }
  td input { width: 100%; }
  footer { padding: 4px 16px; background: var(--nav); border-top: 1px solid var(--divider); color: var(--text-2); font-size: 12px;
           display: flex; gap: 16px; white-space: nowrap; overflow: hidden; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #empty div { max-width: 512px; background: var(--surface); border-radius: 16px; padding: 24px; border: 1px solid var(--divider); }
  #empty h2 { margin: 0 0 8px; font-size: 16px; }
  #empty code { background: var(--nav); padding: 0 4px; border-radius: 4px; }
  #gl-msg { position: absolute; left: 16px; top: 16px; right: 16px; color: var(--text); background: var(--surface);
            border: 1px solid var(--divider); border-radius: 8px; padding: 8px 12px; display: none; }
  #stage.three #gl-msg.show { display: block; }
  .drop { outline: 3px dashed var(--accent); outline-offset: -8px; }
  @media (max-width: 768px) {
    main { flex-direction: column; }
    aside { width: auto; height: 40%; border-left: 0; border-top: 1px solid var(--divider); }
    header h1 { display: none; }
    .toolbar .sep { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Pomegrade · Remake world editor</h1>
  <label class="button" title="Open world_oras.json (Ctrl+O)">Open world<input id="open" type="file" accept=".json,application/json"></label>
  <button id="save" disabled title="Save (Ctrl+S)">Save</button>
  <button id="undo" disabled title="Undo (Ctrl+Z)">Undo</button>
  <button id="redo" disabled title="Redo (Ctrl+Y)">Redo</button>
  <span class="spacer"></span>
  <button id="tab2d" class="on">Map</button>
  <button id="tab3d">3D</button>
</header>
<div class="toolbar">
  <div class="group" id="tools">
    <button data-tool="select" class="on" title="Select and move (V)">Select</button>
    <button data-tool="paint" title="Paint tiles (B)">Paint</button>
    <button data-tool="pick" title="Pick a tile's value into the brush (I)">Pick</button>
    <button data-tool="building" title="Add a building (click to place)">+ Building</button>
    <button data-tool="warp" title="Add a warp (click a tile)">+ Warp</button>
  </div>
  <span class="sep"></span>
  <div class="group">
    <label>Behaviour <input id="brush-behaviour" class="narrow" type="text" value="00" maxlength="2" title="Tile behaviour, hex 00-FF"></label>
    <label><input id="brush-solid" type="checkbox"> Solid</label>
    <label>Model <input id="new-model" class="narrow" type="number" min="0" value="0" title="DS building model for + Building"></label>
  </div>
  <span class="sep"></span>
  <div class="group" id="layers">
    <label><input type="checkbox" data-layer="tiles" checked> Tiles</label>
    <label><input type="checkbox" data-layer="grid" checked> Pieces</label>
    <label><input type="checkbox" data-layer="buildings" checked> Buildings</label>
    <label><input type="checkbox" data-layer="warps" checked> Warps</label>
  </div>
  <span class="sep"></span>
  <button id="fit" title="Fit the world in view (F)">Fit</button>
</div>
<main>
  <div id="stage">
    <canvas id="map"></canvas>
    <canvas id="gl"></canvas>
    <div id="gl-msg"></div>
    <div id="empty"><div>
      <h2>Open a world</h2>
      <p>Open or drop <code>world_oras.json</code>, written by
        <code>remake_tool oras-world &lt;rom.nds&gt; &lt;matrix&gt; &lt;out dir&gt;</code>.</p>
      <p class="muted">The 3D tab opens <code>world_oras.gltf</code> from the same folder.</p>
    </div></div>
  </div>
  <aside>
    <nav><button id="ptab-inspect" class="on">Inspector</button><button id="ptab-assoc">Associations</button></nav>
    <section id="panel-inspect"></section>
    <section id="panel-assoc" hidden></section>
  </aside>
</main>
<footer><span id="st-tile">—</span><span id="st-world">No world open</span><span id="st-msg"></span></footer>
<input id="open3d" type="file" accept=".gltf,model/gltf+json,application/json">

<script>
"use strict";
// ---- constants: the world format (tools/remake/src/N3dsWorld.h) ----
const PIECE = 40, UNIT = 18;          // ORAS: tiles a piece, units a tile
const SOLID = 0x8000;                 // a permission's high byte 0x80: solid (Platinum: the only high-byte value)
const $ = (id) => document.getElementById(id);

// ---- state ----
let world = null, fileName = "world_oras.json";
let pieces = new Map();               // "x,y" -> piece
let W = 0, H = 0;                     // world size in tiles
let dirty = false;
const undoStack = [], redoStack = [];
let tool = "select", selection = null, hover = null;
const layers = { tiles: true, grid: true, buildings: true, warps: true };
const view = { scale: 1, ox: 0, oy: 0 };  // screen = (tile - o) * scale
let base = null, baseCtx = null, baseImg = null;

// ---- world access ----
function key(px, py) { return px + "," + py; }
function tileAt(gx, gy) {
  if (gx < 0 || gy < 0 || gx >= W || gy >= H) return -1;
  const p = pieces.get(key(Math.floor(gx / PIECE), Math.floor(gy / PIECE)));
  return p ? p.permissions[(gy % PIECE) * PIECE + gx % PIECE] : -1;
}
function pieceFor(px, py, create) {
  let p = pieces.get(key(px, py));
  if (!p && create) {
    p = { x: px, y: py, permissions: new Array(PIECE * PIECE).fill(-1), buildings: [], warps: [] };
    world.pieces.push(p); pieces.set(key(px, py), p);
  }
  return p;
}
function setTile(gx, gy, v) {
  const p = pieceFor(Math.floor(gx / PIECE), Math.floor(gy / PIECE), true);
  p.permissions[(gy % PIECE) * PIECE + gx % PIECE] = v;
  paintBasePixel(gx, gy, v);
}
// a building's place in world tiles (its position is ORAS units from its piece's centre)
function buildingTile(p, b) { return [p.x * PIECE + PIECE / 2 + b.position[0] / UNIT, p.y * PIECE + PIECE / 2 + b.position[2] / UNIT]; }
function warpTile(p, w) { return [p.x * PIECE + w.tile[0], p.y * PIECE + w.tile[1]]; }

// ---- colours: as remake_tool's collision.png (solid dark, behaviour 0 white, others a stable colour each) ----
function colourOf(v) {
  if (v < 0) return [0, 0, 0, 0];
  if (v & SOLID) return [32, 32, 32, 255];
  const b = v & 0xFF;
  if (!b) return [255, 255, 255, 255];
  const k = Math.imul(b, 2654435761) >>> 0;
  return [96 + (k >>> 8 & 127), 96 + (k >>> 16 & 127), 96 + (k >>> 24 & 127), 255];
}
function buildBase() {
  base = document.createElement("canvas"); base.width = W; base.height = H;
  baseCtx = base.getContext("2d"); baseImg = baseCtx.createImageData(W, H);
  for (const p of world.pieces)
    for (let t = 0; t < PIECE * PIECE; t++) {
      const gx = p.x * PIECE + t % PIECE, gy = p.y * PIECE + Math.floor(t / PIECE);
      if (gx < W && gy < H) writePixel(gx, gy, p.permissions[t]);
    }
  baseCtx.putImageData(baseImg, 0, 0);
}
function writePixel(gx, gy, v) { const c = colourOf(v), i = (gy * W + gx) * 4; baseImg.data.set(c, i); }
function paintBasePixel(gx, gy, v) {
  if (gx >= W || gy >= H) return;
  writePixel(gx, gy, v);
  baseCtx.putImageData(baseImg, 0, 0, gx, gy, 1, 1);
}

// ---- loading and saving ----
function load(json, name) {
  const w = JSON.parse(json);
  if (w.format !== "pomegrade-remake-n3ds-world") throw new Error("Not a remake world file (format " + w.format + ")");
  if (w.version !== 1) throw new Error("World format version " + w.version + " is not supported (1 is)");
  if (w.pieceTiles !== PIECE || w.tileUnits !== UNIT) throw new Error("Unexpected piece size or tile units");
  for (const p of w.pieces) { p.buildings = p.buildings || []; p.warps = p.warps || []; }
  w.associations = w.associations || {};
  world = w; fileName = name || "world_oras.json";
  pieces = new Map(w.pieces.map((p) => [key(p.x, p.y), p]));
  W = w.width * PIECE; H = w.height * PIECE;
  undoStack.length = 0; redoStack.length = 0; selection = null; setDirty(false);
  buildBase(); fit(); $("empty").style.display = "none";
  $("save").disabled = false;
  const nb = w.pieces.reduce((n, p) => n + p.buildings.length, 0), nw = w.pieces.reduce((n, p) => n + p.warps.length, 0);
  $("st-world").textContent = `${fileName}: ${w.width}×${w.height} pieces (${w.pieces.length} used), ${nb} buildings, ${nw} warps`;
  refreshPanels(); render();
}
function save() {
  if (!world) return;
  const blob = new Blob([JSON.stringify(world)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fileName; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  setDirty(false); status("Saved " + fileName + " (downloaded)");
}
function setDirty(d) { dirty = d; document.title = (d ? "• " : "") + "Remake World Editor"; }
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
function openFile(file) {
  if (!file) return;
  if (dirty && !confirm("Discard the unsaved changes?")) return;
  file.text().then((t) => load(t, file.name)).catch((e) => alert("Could not open " + file.name + ":\n" + e.message));
}
$("open").addEventListener("change", (e) => { openFile(e.target.files[0]); e.target.value = ""; });
$("save").addEventListener("click", save);

// ---- undo / redo: each edit is a {label, undo, redo} ----
function commit(op) { op.redo(); undoStack.push(op); redoStack.length = 0; setDirty(true); refreshUndo(); refreshPanels(); render(); }
function undo() { const op = undoStack.pop(); if (!op) return; op.undo(); redoStack.push(op); setDirty(true); after(op, "Undid"); }
function redo() { const op = redoStack.pop(); if (!op) return; op.redo(); undoStack.push(op); setDirty(true); after(op, "Redid"); }
function after(op, verb) { refreshUndo(); validateSelection(); refreshPanels(); render(); status(verb + " " + op.label); }
function refreshUndo() { $("undo").disabled = !undoStack.length; $("redo").disabled = !redoStack.length; }
$("undo").addEventListener("click", undo); $("redo").addEventListener("click", redo);
function validateSelection() {
  if (!selection) return;
  const list = selection.piece[selection.kind === "building" ? "buildings" : "warps"];
  if (!list.includes(selection.item)) selection = null;
}

// moving an object to another tile may move it to another piece: remove it, recompute, insert
function placeObject(kind, item, gx, gy) {
  const px = Math.min(Math.max(Math.floor(gx / PIECE), 0), world.width - 1), py = Math.min(Math.max(Math.floor(gy / PIECE), 0), world.height - 1);
  const p = pieceFor(px, py, true);
  if (kind === "building") { item.position[0] = (gx - (px * PIECE + PIECE / 2)) * UNIT; item.position[2] = (gy - (py * PIECE + PIECE / 2)) * UNIT; }
  else item.tile = [Math.floor(gx) - px * PIECE, Math.floor(gy) - py * PIECE];
  p[kind === "building" ? "buildings" : "warps"].push(item);
  return p;
}
function removeObject(kind, piece, item) {
  const list = piece[kind === "building" ? "buildings" : "warps"], i = list.indexOf(item);
  if (i >= 0) list.splice(i, 1);
}
function objectTile(kind, piece, item) { return kind === "building" ? buildingTile(piece, item) : warpTile(piece, item); }
function moveOp(kind, piece, item, from, to) {
  let at = piece;
  return {
    label: "move " + kind,
    redo() { removeObject(kind, at, item); at = placeObject(kind, item, to[0], to[1]); if (selection && selection.item === item) selection.piece = at; },
    undo() { removeObject(kind, at, item); at = placeObject(kind, item, from[0], from[1]); if (selection && selection.item === item) selection.piece = at; },
  };
}
function addOp(kind, item, gx, gy) {
  let at = null;
  return {
    label: "add " + kind,
    redo() { at = placeObject(kind, item, gx, gy); selection = { kind, piece: at, item }; },
    undo() { removeObject(kind, at, item); if (selection && selection.item === item) selection = null; },
  };
}
function deleteOp(kind, piece, item) {
  const [gx, gy] = objectTile(kind, piece, item);
  let at = piece;
  return {
    label: "delete " + kind,
    redo() { removeObject(kind, at, item); if (selection && selection.item === item) selection = null; },
    undo() { at = placeObject(kind, item, kind === "warp" ? gx + 0.5 : gx, kind === "warp" ? gy + 0.5 : gy); },
  };
}
function fieldOp(label, target, field, value) {
  const old = target[field];
  return { label, redo() { target[field] = value; }, undo() { target[field] = old; } };
}

// ---- 2D view ----
const map = $("map"), ctx = map.getContext("2d");
// both canvases fill the stage (the hidden one measures 0)
function resize() {
  const r = $("stage").getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  map.width = Math.max(1, Math.round(r.width * dpr)); map.height = Math.max(1, Math.round(r.height * dpr));
  render(); if (gl3d) draw3d();
}
window.addEventListener("resize", resize);
function fit() {
  if (!world) return;
  const r = $("stage").getBoundingClientRect(), s = Math.min(r.width / W, r.height / H) * 0.96;
  view.scale = s; view.ox = W / 2 - r.width / 2 / s; view.oy = H / 2 - r.height / 2 / s; render();
}
$("fit").addEventListener("click", fit);
function toScreen(gx, gy) { return [(gx - view.ox) * view.scale, (gy - view.oy) * view.scale]; }
function toTile(sx, sy) { return [sx / view.scale + view.ox, sy / view.scale + view.oy]; }
function render() {
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, map.width, map.height);
  if (!world) return;
  const s = view.scale;
  if (layers.tiles) { ctx.imageSmoothingEnabled = false; ctx.drawImage(base, -view.ox * s, -view.oy * s, W * s, H * s); }
  else { ctx.fillStyle = "rgba(128,128,128,0.24)"; for (const p of world.pieces) ctx.fillRect((p.x * PIECE - view.ox) * s, (p.y * PIECE - view.oy) * s, PIECE * s, PIECE * s); }
  if (layers.grid) {
    ctx.strokeStyle = "rgba(162,15,39,0.48)"; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x <= world.width; x++) { const sx = Math.round((x * PIECE - view.ox) * s) + 0.5; ctx.moveTo(sx, (-view.oy) * s); ctx.lineTo(sx, (H - view.oy) * s); }
    for (let y = 0; y <= world.height; y++) { const sy = Math.round((y * PIECE - view.oy) * s) + 0.5; ctx.moveTo((-view.ox) * s, sy); ctx.lineTo((W - view.ox) * s, sy); }
    ctx.stroke();
  }
  const r = Math.max(4, s * 0.5);
  if (layers.warps) {
    for (const p of world.pieces) for (const w of p.warps) {
      const [sx, sy] = toScreen(...warpTile(p, w));
      ctx.fillStyle = "#1E88E5"; ctx.fillRect(sx, sy, Math.max(4, s), Math.max(4, s));
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.strokeRect(sx + 0.5, sy + 0.5, Math.max(4, s) - 1, Math.max(4, s) - 1);
    }
  }
  if (layers.buildings) {
    for (const p of world.pieces) for (const b of p.buildings) {
      const [sx, sy] = toScreen(...buildingTile(p, b));
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fillStyle = world.associations[b.model] && world.associations[b.model].oras ? "#43A047" : "#FB8C00"; ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke();
    }
  }
  if (selection) {
    const [gx, gy] = objectTile(selection.kind, selection.piece, selection.item);
    const [sx, sy] = toScreen(gx + (selection.kind === "warp" ? 0.5 : 0), gy + (selection.kind === "warp" ? 0.5 : 0));
    ctx.beginPath(); ctx.arc(sx, sy, r + 6, 0, Math.PI * 2); ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--sel"); ctx.lineWidth = 3; ctx.stroke();
  }
  if (hover && s >= 4) {
    const [sx, sy] = toScreen(Math.floor(hover[0]), Math.floor(hover[1]));
    ctx.strokeStyle = "rgba(240,86,107,0.96)"; ctx.lineWidth = 2; ctx.strokeRect(sx, sy, s, s);
  }
}

// hit test: the nearest building or warp within 12px
function hitObject(sx, sy) {
  let best = null, bestD = 12;
  for (const p of world.pieces) {
    if (layers.buildings) for (const b of p.buildings) {
      const [x, y] = toScreen(...buildingTile(p, b)), d = Math.hypot(x - sx, y - sy);
      if (d < bestD) { bestD = d; best = { kind: "building", piece: p, item: b }; }
    }
    if (layers.warps) for (const w of p.warps) {
      const [tx, ty] = warpTile(p, w), [x, y] = toScreen(tx + 0.5, ty + 0.5), d = Math.hypot(x - sx, y - sy);
      if (d < bestD) { bestD = d; best = { kind: "warp", piece: p, item: w }; }
    }
  }
  return best;
}

// ---- pointer input: pan, zoom, pinch, tools ----
const pointers = new Map();
let gesture = null; // {type: "pan"|"paint"|"drag"|"pinch", ...}
function localPoint(e) { const r = map.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function brushValue() {
  const b = parseInt($("brush-behaviour").value, 16);
  return ((isNaN(b) ? 0 : b) & 0xFF) | ($("brush-solid").checked ? SOLID : 0);
}
map.addEventListener("pointerdown", (e) => {
  if (!world) return;
  map.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, localPoint(e));
  if (pointers.size === 2) { // pinch: ends any single-pointer gesture
